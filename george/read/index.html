<main class="page-content" aria-label="Content">
  <div class="wrapper">

    <h1 class="george-page-title">Read</h1>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="browse" onclick="switchTab('browse')">Browse</button>
      <button class="tab-btn"        data-tab="add"    onclick="switchTab('add')">Add a link</button>
    </div>

    <div id="pane-browse" class="tab-pane active">
      <div class="browse-controls">
        <input class="browse-search" id="browseSearch" type="text"
               placeholder="Search by title, URL or tag…" oninput="renderBrowse()">
        <span class="browse-count" id="browseCount"></span>
      </div>
      <div class="tag-toggle-bar" id="browseTags"></div>
      <div class="browse-random-bar">
        <button class="btn-open-random" onclick="openRandom()">Open random</button>
        <div class="open-result" id="openResult"></div>
      </div>
      <div class="tiles-grid" id="tilesGrid"></div>
    </div>

    <div id="pane-add" class="tab-pane">
      <div class="add-form">
        <div class="field">
          <label for="fUrl">URL</label>
          <input type="url" id="fUrl" placeholder="https://example.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="fTitle">Title <span class="opt">(optional)</span></label>
          <input type="text" id="fTitle" placeholder="My favourite site" autocomplete="off">
        </div>
        <div class="field">
          <label for="fTags">Tags <span class="opt">(comma-separated)</span></label>
          <input type="text" id="fTags" placeholder="essays, philosophy, science" autocomplete="off">
          <p class="field-hint">e.g. "essays, philosophy, science"</p>
        </div>
        <button class="btn-add" onclick="addLink()">Save link</button>
        <span class="add-feedback" id="addFeedback"></span>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer h-card">
  <data class="u-url" href="/"></data>

</footer>
